name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shuvotrading35-a11y
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_dots=#A78BFA,#7C3AED,#22D3EE,#10B981,#2d3343&color_empty=#2d3343
            dist/snake-light.svg?palette=github&color_dots=#7C3AED,#0891B2,#10B981,#059669,#E2E8F0&color_empty=#E2E8F0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
